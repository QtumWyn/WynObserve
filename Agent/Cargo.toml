[package]
name = "wyncommand-agent"
version = "0.2.0"
edition = "2024"
description = "Distributed system telemetry agent for WynCommand Fleet"

[[bin]]
name = "wyn-agent"
path = "src/main.rs"

[dependencies]
sysinfo = "0.39.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.13"
libc = "0.2"
wyn-protocol = { workspace = true }
toml = "1.1.5"
iced-x86 = "1.21.0"

[target.'cfg(target_os = "linux")'.dependencies]
perf-event-open-sys = "6.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_Etw", "Win32_System_Memory", "Win32_System_ProcessStatus",
  "Win32_System_Performance", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_Storage_FileSystem",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_System_Com", "Win32_System_LibraryLoader", "Wdk_Graphics_Direct3D"
] }

windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_Graphics_DXCore", "Win32_Foundation"] }

[build-dependencies]
cc = "1"

[package.metadata.deb]
name = "wyncommand-agent"
maintainer = "QtumWyn <Qtummechanic25@gmail.com>"
section = "utils"
priority = "optional"
depends = "$auto"

maintainer-scripts = "debian"

assets = [
    [
        "target/release/wyn-agent",
        "usr/bin/wyn-agent",
        "755"
    ],
    [
        "deploy/linux/wyn-agent-setup",
        "usr/bin/wyn-agent-setup",
        "755"
    ],
]

[package.metadata.deb.systemd-units]
unit-name = "wyn-agent"
enable = false
start = false
restart-after-upgrade = true