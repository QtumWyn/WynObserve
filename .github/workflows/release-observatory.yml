name: Release Observatory

on:
  push:
    tags:
      - "observatory-v*"

permissions:
  contents: write

jobs:
  release:
    name: Build WynObserve Observatory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Update Rust
        run: |
          rustup update stable
          rustup default stable

      - name: Install cargo-deb
        run: |
          cargo install cargo-deb --locked

      - name: Verify Observatory tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(
            cargo metadata \
              --no-deps \
              --format-version 1 \
            | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)

          package = next(
              package
              for package in metadata["packages"]
              if package["name"] == "wyn-observatory-ui"
          )

          print(package["version"])
          '
          )"

          TAG_VERSION="${GITHUB_REF_NAME#observatory-v}"

          echo "Observatory version: ${PACKAGE_VERSION}"
          echo "Release tag version: ${TAG_VERSION}"

          if [[ "${PACKAGE_VERSION}" != "${TAG_VERSION}" ]]; then
              echo
              echo "ERROR // Observatory tag/version mismatch."
              exit 1
          fi

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build Observatory package
        run: |
          cargo deb \
            --package wyn-observatory-ui

      - name: Generate checksums
        shell: bash
        run: |
          PACKAGE="$(
            find target \
              -name 'wynobserve*.deb' \
              -print \
              -quit
          )"

          if [[ -z "$PACKAGE" ]]; then
              echo "ERROR // Observatory Debian package not found"
              exit 1
          fi

          PACKAGE_DIR="$(dirname "$PACKAGE")"

          cd "$PACKAGE_DIR"

          sha256sum \
              "$(basename "$PACKAGE")" \
              > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PACKAGE="$(
            find target \
              -name 'wynobserve*.deb' \
              -print \
              -quit
          )"

          PACKAGE_DIR="$(dirname "$PACKAGE")"

          gh release create \
              "${GITHUB_REF_NAME}" \
              "$PACKAGE" \
              "$PACKAGE_DIR/SHA256SUMS" \
              --title "WynObserve ${GITHUB_REF_NAME}" \
              --generate-notes
